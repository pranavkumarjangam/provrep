[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provrep"
version = "0.1.0"
description = "Provenance-Grounded Drug Repurposing via Agentic Evidence Adjudication"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "J Pranav Kumar" },
  { name = "V Sri Teja" },
  { name = "Shishir Gella" },
  { name = "C Girish" },
]
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "pydantic>=2.5",
  "httpx>=0.25",
  "langgraph>=0.2",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
nli = ["transformers>=4.40"]
dev = ["pytest>=7.4"]

[project.scripts]
provrep = "provrep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
provrep = ["api/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
